<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340">
<rect width="760" height="340" rx="10" fill="#1d2021" stroke="#3c3836"/>
<rect width="760" height="36" rx="10" fill="#3c3836"/><rect y="26" width="760" height="10" fill="#3c3836"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="380" y="23" text-anchor="middle" fill="#a89984" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">nvim: leader keys</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
<text x="24" y="64" font-size="16" xml:space="preserve"><tspan fill="#928374">$ </tspan><tspan fill="#ebdbb2">leader = Space</tspan></text>
<text x="24" y="100" font-size="15" xml:space="preserve"><tspan fill="#fabd2f" font-weight="700">&lt;leader&gt;f</tspan><tspan fill="#ebdbb2">  telescope   </tspan><tspan fill="#a89984">ff files  fw grep  fb buffers  fo recent  fy yanks</tspan></text>
<text x="24" y="130" font-size="15" xml:space="preserve"><tspan fill="#fe8019" font-weight="700">&lt;leader&gt;g</tspan><tspan fill="#ebdbb2">  git         </tspan><tspan fill="#a89984">gg lazygit  gs status  gc commit  gp push  gd diff</tspan></text>
<text x="24" y="160" font-size="15" xml:space="preserve"><tspan fill="#b8bb26" font-weight="700">&lt;leader&gt;c</tspan><tspan fill="#ebdbb2">  compile     </tspan><tspan fill="#a89984">cc compile  cr recompile  ch history</tspan></text>
<text x="24" y="190" font-size="15" xml:space="preserve"><tspan fill="#fb4934" font-weight="700">&lt;leader&gt;d</tspan><tspan fill="#ebdbb2">  diagnostics </tspan><tspan fill="#a89984">df float  dl loclist  dq quickfix  dt telescope</tspan></text>
<text x="24" y="220" font-size="15" xml:space="preserve"><tspan fill="#8ec07c" font-weight="700">&lt;leader&gt;h</tspan><tspan fill="#ebdbb2">  harpoon     </tspan><tspan fill="#a89984">a add  1..4 jump  hc clear  &lt;C-e&gt; menu</tspan></text>
<text x="24" y="250" font-size="15" xml:space="preserve"><tspan fill="#d3869b" font-weight="700">&lt;leader&gt;m</tspan><tspan fill="#ebdbb2">  markdown    </tspan><tspan fill="#a89984">mb live preview in the browser</tspan></text>
<text x="24" y="280" font-size="15" xml:space="preserve"><tspan fill="#83a598" font-weight="700">&lt;leader&gt;e</tspan><tspan fill="#ebdbb2">  oil         </tspan><tspan fill="#a89984">e open the file explorer</tspan></text>
<text x="24" y="310" font-size="15" xml:space="preserve"><tspan fill="#a89984" font-weight="700">&lt;leader&gt;u</tspan><tspan fill="#ebdbb2">  undotree    </tspan><tspan fill="#a89984">u toggle the undo tree</tspan></text>
</g>
</svg>
